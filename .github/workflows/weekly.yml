# Weekly upkeep, off the push path: move the plugin pins, and open a PR when
# they moved.
#
# A PR opened with the default GITHUB_TOKEN does not trigger ci.yml. Close and
# reopen it, or push to its branch, to get a run.
name: Weekly

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-updates:
    name: Check for updates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: stable

      # The plain boot installs every plugin at its current pin, since repin
      # pick reads the clones. The update after the pick checks the picks out
      # and rewrites the lock.
      - name: Update the plugins
        run: |
          mkdir -p ~/.config
          ln -sfn "$PWD" ~/.config/nvim

          nvim --headless +qa
          NVIM_APPNAME=nvim ./.github/scripts/repin pick 14
          nvim --headless "+lua vim.pack.update(nil, { force = true })" +qa
          git diff --stat

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: plugin-updates
          # What .github/release.yml sorts on, so this lands under
          # "Dependency updates" in the release notes.
          labels: dependencies
          # Commits through the API, so GitHub signs them; a ruleset rejects
          # unsigned pushes on every branch, this one included.
          sign-commits: true
          commit-message: "plugins: updated pinned revisions"
          title: "plugins: updated pinned revisions"
          body: >
            This PR updates the pinned plugin revisions in `plugins.lua` and
            `nvim-pack-lock.json`, from the weekly run. Only releases that
            have been out for at least 14 days are taken, so this is never
            the newest of anything. Review the changelogs locally with
            `:lua vim.pack.update()`.
